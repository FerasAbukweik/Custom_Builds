name: Deploy .NET Backend to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'                          
      - 'Custom_Builds.Core/**'           
      - 'Custom_Builds.Infrastructure/**'
      - 'Custom_Builds.WebApi/**'
      - '!FrontEnd/**'               

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: '${{ github.workspace }}'
          dockerfilePath: 'src/Custom_Builds.WebApi/Dockerfile'
          containerAppName: custom-builds-api
          resourceGroup: custom-builds-rg