name: Deploy .NET Backend to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'Custom_Builds.Core/**'
      - 'Custom_Builds.Infrastructure/**'
      - 'Custom_Builds.WebApi/**'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR credentials
        id: acr_creds
        run: |
          username=$(az acr credential show --name custombuildsregistry --query username --output tsv)
          acr_pwd=$(az acr credential show --name custombuildsregistry --query "passwords[0].value" --output tsv)
          echo "::add-mask::$acr_pwd"
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "acr_pwd=$acr_pwd" >> "$GITHUB_OUTPUT"

      - name: Build and Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: '${{ github.workspace }}'
          dockerfilePath: 'src/Custom_Builds.WebApi/Dockerfile'
          acrName: custombuildsregistry
          acrUsername: ${{ steps.acr_creds.outputs.username }}
          acrPassword: ${{ steps.acr_creds.outputs.acr_pwd }}
          containerAppName: custom-builds-api
          resourceGroup: custom-builds-rg