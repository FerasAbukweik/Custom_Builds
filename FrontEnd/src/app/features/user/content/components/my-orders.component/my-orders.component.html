<app-user-content-wrapper
  [pageName]="'Order Tracking'"
  [subText]="'You have ' + orders.length + ' custom peripherals currently in production.'"
  class="max-w-450 mx-auto"
>
  <div class="flex flex-col gap-8 max-h-full overflow-y-scroll">
    @for (order of orders(); track order.id ; let isLast = $last) {
      <app-order-review [order]="order">
        @if(isLast){
          <span (appIsVisable)="lazyGetOrders()"></span>
        }
      </app-order-review>

      @if(isLast && isLoading()){
        <span class="w-full flex justify-center">
          <app-loading />
        </span>
      }
    }
    @empty {
      @if (isLoading()) {
        <app-loading class="w-full flex justify-center" />
      } @else {
        <div class="text-2xl md:text-3xl lg:text-4xl font-bold tracking-tight text-white w-full flex justify-center">
          No orders yet
        </div>
      }
    }
  </div>
</app-user-content-wrapper>
