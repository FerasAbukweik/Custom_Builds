<app-user-content-wrapper
  [pageName]="'Order Tracking'"
  [subText]="'You have ' + orderService.processingOrdersCount() + ' pending orders'"
>
  <div class="flex flex-col gap-8 max-h-full overflow-y-scroll">
    @for (order of orderService.processingOrders(); track order.id; let isLast = $last) {
      <app-order-card [order]="order" />
    } @empty {
      @if (!orderService.isLoadingProcessingOrders()) {
        <div
          class="text-2xl md:text-3xl lg:text-4xl font-bold tracking-tight text-white w-full flex justify-center"
        >
          No orders yet
        </div>
      }
    }

    <span (appIsVisable)="orderService.lazyGetProcessingOrders()"></span>

    @if (orderService.isLoadingProcessingOrders()) {
      <span class="w-full flex justify-center">
        <app-loading />
      </span>
    }

    <span class="h-10 w-full"></span>
  </div>
</app-user-content-wrapper>
