<app-user-content-wrapper
  [pageName]="'Order History'"
  [subText]="'Review and manage your past custom builds and purchases.'"
>
  <section class="flex flex-col gap-8 max-h-max overflow-y-scroll">
    <app-state-data [statCardData]="statCardData()" />

    <div class="bg-deep-blue border border-dark-blue-gray rounded-xl shadow-xl mb-8 max-w-500">
      <app-orders-table
        [isLoading]="historyService.isLoading()"
        [sectionsOrders]="historyService.sectionsOrders()"
        [allOrdersCount]="historyService.summary().count"
        (changeSectionOutput)="historyService.loadSection($event)"
      />
    </div>
  </section>
</app-user-content-wrapper>
